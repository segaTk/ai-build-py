version: '3.8'

services:
  # --- PostgreSQL ---
  db:
    image: postgres:16
    container_name: ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:st}
      POSTGRES_PASSWORD: ${DB_PASS:pass_postgres}
      POSTGRES_DB: ${DB_NAME:super_po_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_/var/lib/postgresql/data
    networks:
      - ai_network

  # --- FastAPI Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      OLLAMA_API_URL: http://host.docker.internal:11434/api/generate
    depends_on:
      - db
    networks:
      - ai_network
    # Ждём, пока БД запустится
    command: >
      sh -c "sleep 5 &&
             python -m uvicorn main:app --host 0.0.0.0 --port 8080"

  # --- Frontend (статический сервер) ---
  frontend:
    image: nginx:alpine
    container_name: ai_frontend
    restart: unless-stopped
    ports:
      - "5050:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - ai_network

volumes:
  postgres_

networks:
  ai_network:
    driver: bridge