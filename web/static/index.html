<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI ST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Manrope:wght@500;600&display=swap"
    rel="stylesheet" />
  <style>
    /* ---------- Общие стили для экрана входа ---------- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Space Grotesk', 'Manrope', 'Segoe UI', system-ui, sans-serif;
      background: #065668;
      color: #e6ecf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    #loginScreen {
      text-align: center;
      background: rgba(15, 23, 42, 0.95); /* немного темнее и прозрачнее */
      padding: 48px 32px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    #loginScreen h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f1f5f9; /* чуть светлее для контраста */
      line-height: 1.2;
    }

    #loginBtn {
      background: linear-gradient(135deg, #911810, #ab0f07);
      color: #04100c;
      border: none;
      border-radius: 16px;
      padding: 16px 28px;
      font-weight: 600;
      cursor: pointer;
      font-size: 17px;
      font-family: 'Space Grotesk', 'Manrope', system-ui, sans-serif;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(47, 224, 162, 0.3);
      width: 100%; /* ← расширяем на всю ширину */
      max-width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #loginBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(47, 224, 162, 0.4);
    }

    #loginBtn:active {
      transform: translateY(0);
      box-shadow: 0 6px 20px rgba(47, 224, 162, 0.25);
    }

    /* Иконка Google — делаем её крупнее и чётче */
    .google-icon {
      width: 24px;
      height: 24px;
      display: inline-block;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%234285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="%2334A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="%23FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.66-2.08z"/><path fill="%23EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>') no-repeat center;
      background-size: contain;
    }

    /* ---------- Скрытие основного интерфейса по умолчанию ---------- */
    #mainApp {
      display: none;
      width: min(1200px, 100%);
    }

    /* ---------- Стили основного интерфейса ---------- */
    :root {
      --bg: #065668;
      --panel: rgba(18, 22, 35, 0.9);
      --accent: #2fe0a2;
      --accent-2: #4fd1ff;
      --text: #e6ecf3;
      --muted: #8c99ac;
      --border: rgba(255, 255, 255, 0.08);
      --glow: #2fe0a233;
    }

    .glow-blob {
      position: fixed;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
      opacity: 0.12;
      filter: blur(72px);
      z-index: -1;
      top: -120px;
      right: -180px;
      animation: float 14s ease-in-out infinite alternate;
    }

    .glow-blob:nth-child(2) {
      background: radial-gradient(circle, var(--accent-2) 0%, transparent 60%);
      top: 60%;
      left: -200px;
      animation-duration: 16s;
    }

    @keyframes float {
      to {
        transform: translate(24px, -18px) scale(1.05);
      }
    }

    .page {
      position: relative;
      width: min(1200px, 100%);
      z-index: 1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #a43d05, #862b0c);
      display: grid;
      place-items: center;
      box-shadow: 0 6px 40px rgba(47, 224, 162, 0.2);
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .logo {
        width: 44px;
        height: 44px;
        font-size: 40px;
      }
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 34px);
      letter-spacing: -0.02em;
    }

    .title span {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chip {
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 14px;
    }

    .chip strong {
      color: var(--text);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--glow);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .panel .subtext {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      resize: vertical;
      transition: border 0.2s ease, transform 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 0 0 6px rgba(47, 224, 162, 0.08);
    }

    .controls {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hints {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #911810, #ab0f07);
      color: #04100c;
      box-shadow: 0 12px 36px rgba(47, 224, 162, 0.28);
      min-width: 140px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .answer {
      margin-top: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 120px;
      line-height: 1.6;
      color: var(--text);
      position: relative;
    }

    .answer.loading::after {
      content: "Генерируем ответ…";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      color: var(--muted);
      letter-spacing: 0.02em;
      animation: shimmer 1.3s linear infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: -200px 0;
      }
      100% {
        background-position: 200px 0;
      }
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .history::-webkit-scrollbar {
      width: 8px;
    }

    .history::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
    }

    .card .label {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card .prompt {
      color: var(--text);
      margin: 0 0 6px;
    }

    .card .response {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(47, 224, 162, 0.12);
      color: #a0f4d8;
      border: 1px solid rgba(47, 224, 162, 0.3);
      font-size: 12px;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      body {
        padding-top: 24px;
        align-items: flex-start;
      }
      #mainApp {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Экран входа -->
  <div id="loginScreen">
    <h1>Добро пожаловать в AI ST 🌞</h1>
    <button id="loginBtn">
      <span class="google-icon"></span>
      Войти через Google
    </button>
  </div>

  <!-- Основной интерфейс (скрыт до авторизации) -->
  <div id="mainApp" class="page">
    <div class="glow-blob"></div>
    <div class="glow-blob"></div>

    <header class="header">
      <div class="brand">
        <div class="logo">您好
        </div>
        <div class="title">
          <h1>ST AI </h1>
          <span>FastAPI → Ollama</span>
        </div>
      </div>
      <div class="status">
        <div class="chip">Telegram: <strong> @AI_helper_by_ST_bot</strong></div>
        <div class="chip">Frontend: <strong>http://localhost:8000</strong></div>
        <div class="badge" id="connBadge"><span class="status-dot"></span><span>Статус API</span></div>
        <button type="button" class="btn-ghost" id="pingBtn">Проверить</button>
        <button type="button" class="btn-ghost" id="logoutBtn">Выйти</button>
      </div>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>Задайте вопрос</h2>
        <p class="subtext">Отправьте промпт в API, ответ сразу появится ниже.</p>
        <textarea id="promptInput" placeholder="Сообщение для поиска"></textarea>
        <div class="controls">
          <div class="hints">
          </div>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn-ghost" id="clearBtn">Очистить</button>
            <button type="button" class="btn-primary" id="sendBtn">Отправить в нейросеть</button>
          </div>
        </div>
        <div class="answer" id="answerBox">Ответ появится здесь.</div>
      </section>

      <aside class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;">
          <div>
            <h2 style="margin:0;">История по вашему IP</h2>
            <p class="subtext">Данные из эндпоинта <code>/requests</code>.</p>
          </div>
          <button class="btn-ghost" id="searchBtn">Поиск</button>
          <button class="btn-ghost" id="refreshBtn">Обновить</button>
        </div>
        <div class="history" id="history"></div>
      </aside>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const API_BASE = 'https://ai-build.space';
      const loginScreen = document.getElementById('loginScreen');
      const mainApp = document.getElementById('mainApp');
      const loginBtn = document.getElementById('loginBtn');

      // === Проверка авторизации ===
      async function checkAuth() {
        try {
          const res = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
          if (res.ok) {
            showMainApp();
            initMainApp();
            return true;
          }
        } catch (e) {
          console.warn('Auth check failed:', e);
        }
        showLoginScreen();
        return false;
      }

      function showLoginScreen() {
        loginScreen.style.display = 'flex';
        mainApp.style.display = 'none';
      }

      function showMainApp() {
        loginScreen.style.display = 'none';
        mainApp.style.display = 'block';
      }

      // === Кнопка входа ===
      loginBtn.addEventListener('click', () => {
        window.location.href = `${API_BASE}/auth/google/url`;
      });

      // === Инициализация основного интерфейса ===
      function initMainApp() {
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const pingBtn = document.getElementById('pingBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const answerBox = document.getElementById('answerBox');
        const historyEl = document.getElementById('history');
        const refreshBtn = document.getElementById('refreshBtn');
        const connBadge = document.getElementById('connBadge');
        const API_URL = `${API_BASE}/requests`;

        // --- Защита от ошибок ---
        if (!connBadge || !logoutBtn || !pingBtn) {
          console.error("❌ Один из элементов не найден");
          return;
        }

        // --- КНОПКА ВЫХОДА ---
        logoutBtn.addEventListener('click', async () => {
          try {
            const res = await fetch(`${API_BASE}/auth/logout`, {
              method: 'POST',
              credentials: 'include'
            });
            if (res && res.ok) {
              showLoginScreen();
            } else {
              const errorText = res ? await res.text() : 'No response';
              console.error('Logout failed:', errorText);
              alert('Не удалось выйти из аккаунта');
            }
          } catch (e) {
            console.error('Logout error:', e);
            alert('Ошибка сети при выходе');
            showLoginScreen();
          }
        });

        // --- КНОПКА "ПРОВЕРИТЬ" ---
        pingBtn.addEventListener('click', async () => {
          try {
            const res = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
            updateStatus(res.ok);
          } catch (e) {
            console.error('Ping failed:', e);
            updateStatus(false);
          }
        });

        // --- Вспомогательные функции ---
        const setLoading = (isLoading) => {
          sendBtn.disabled = isLoading;
          sendBtn.style.opacity = isLoading ? 0.65 : 1;
          answerBox.classList.toggle('loading', isLoading);
        };

        const updateStatus = (ok) => {
          const dot = connBadge.querySelector('.status-dot');
          if (!dot) return;
          
          connBadge.style.borderColor = ok ? 'rgba(47, 224, 162, 0.4)' : 'rgba(255, 86, 86, 0.4)';
          connBadge.style.background = ok ? 'rgba(47, 224, 162, 0.12)' : 'rgba(255, 86, 86, 0.10)';
          connBadge.querySelector('span:last-child').textContent = ok ? 'API доступен' : 'API недоступен';
          dot.style.background = ok ? 'var(--accent)' : '#ff5656';
          dot.style.boxShadow = ok ? '0 0 12px var(--glow)' : '0 0 12px rgba(255,86,86,0.4)';
        };

        const renderHistory = (items) => {
          historyEl.innerHTML = '';
          if (!items || !items.length) {
            historyEl.innerHTML = '<div class="empty">История пуста. Отправьте первый запрос.</div>';
            return;
          }
          items.slice().reverse().forEach(({ prompt, response, id }) => {
            const card = document.createElement('div');
            card.className = 'card';

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = `#${id ?? '—'}`;

            const promptEl = document.createElement('p');
            promptEl.className = 'prompt';
            promptEl.textContent = prompt;

            const responseEl = document.createElement('p');
            responseEl.className = 'response';
            responseEl.textContent = response;

            card.appendChild(label);
            card.appendChild(promptEl);
            card.appendChild(responseEl);
            historyEl.appendChild(card);
          });
        };

        const fetchHistory = async () => {
          try {
            const res = await fetch(API_URL, { credentials: 'include' });
            if (!res.ok) throw new Error('History fetch failed');
            const data = await res.json();
            renderHistory(data);
            updateStatus(true);
          } catch (e) {
            console.error(e);
            renderHistory([]);
            updateStatus(false);
          }
        };

        const sendPrompt = async () => {
          const prompt = promptInput.value.trim();
          if (!prompt) return;
          setLoading(true);
          try {
            const res = await fetch(API_URL, {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prompt })
            });
            if (!res.ok) throw new Error('API request failed');
            const data = await res.json();
            answerBox.textContent = data.answer || 'Пустой ответ';
            await fetchHistory();
          } catch (e) {
            console.error(e);
            answerBox.textContent = 'Ошибка: проверьте подключение к API.';
            updateStatus(false);
          } finally {
            setLoading(false);
          }
        };

        // --- Загрузка истории при старте ---
        fetchHistory();

        // --- Привязка обработчиков ---
        sendBtn.addEventListener('click', sendPrompt);
        clearBtn.addEventListener('click', () => {
          promptInput.value = '';
          promptInput.focus();
        });
        refreshBtn.addEventListener('click', fetchHistory);
        promptInput.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            sendPrompt();
          }
        });
        setTimeout(() => {
          const btn = document.getElementById('logoutBtn');
          if (btn) {
            btn.addEventListener('click', () => {
              alert('Выйти из аккаунта?');
            });
          }
        }, 100);
      }

      // === Запуск проверки авторизации ===
      checkAuth();
    });
  </script>
</body>
</html>
